name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ams_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migrationen als Eigentümer, Tests als eingeschränkte Rolle (Row-Level Security wirkt nur ohne Superuser)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ams_test
      TEST_DATABASE_URL: postgresql://ams_app:ams_app@localhost:5432/ams_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Anwendungsrolle ohne Superuser anlegen
        run: psql "$DATABASE_URL" -v app_password="'ams_app'" -f scripts/db-app-role.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
